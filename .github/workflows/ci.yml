name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare output dir
        run: mkdir -p out_dir

      - name: Set default Frida version
        run: echo "FRIDA_VERSION=16.2.5" >> "$GITHUB_ENV"

      - name: Get Frida version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "FRIDA_VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Patch Frida gadgets
        run: |
          set -euo pipefail

          for ARCH in android-arm64 android-arm; do
            FILE="frida-gadget-${FRIDA_VERSION}-${ARCH}.so"
            URL="https://github.com/frida/frida/releases/download/${FRIDA_VERSION}/${FILE}.xz"

            echo "Downloading $URL"
            curl -fL "$URL" -o "${FILE}.xz"

            xz -d "${FILE}.xz"

            echo "Original checksum:"
            sha256sum "$FILE"

            python src/frida-patcher.py -b "$FILE" -o "out_dir/$FILE"

            echo "Patched checksum:"
            sha256sum "out_dir/$FILE"

            xz -z "out_dir/$FILE"
          done

      - name: Upload artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: frida-gadget
          path: out_dir/*.xz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out_dir/*.xz
