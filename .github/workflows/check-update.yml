name: Check Frida Updates

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get latest Frida release
        id: frida
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/frida/frida/releases/latest"

          HTTP_CODE=$(
            curl -sSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o response.json \
              -w "%{http_code}" \
              "$API_URL"
          )

          if [ "$HTTP_CODE" != "200" ]; then
            echo "GitHub API failed: HTTP $HTTP_CODE"
            cat response.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(jq -r '.tag_name // empty' response.json)

          if [ -z "$LATEST" ]; then
            echo "tag_name not found in API response"
            cat response.json
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Latest Frida: $LATEST"

      - name: Check if tag already exists
        if: steps.frida.outputs.skip == 'false'
        id: check
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git tag -l | grep -qx "${{ steps.frida.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag already exists: ${{ steps.frida.outputs.version }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "New version found: ${{ steps.frida.outputs.version }}"
          fi

      - name: Create and push tag with PAT
        if: steps.frida.outputs.skip == 'false' && steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.frida.outputs.version }}"

          git remote set-url origin "https://x-access-token:${{ secrets.PAT_PUSH_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin "refs/tags/${{ steps.frida.outputs.version }}"
